{% extends 'scripts.html' %} {% block title %}Create your Hangman account{%
endblock %} {% block content %}
<main class="gate">
  {% include 'gate_story.html' %}
  <section class="auth-card">
    <h2>Save your score</h2>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="POST" action="{{ url_for('register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label for="username">Name on the leaderboard</label>
      <input type="text" id="username" name="username" required />
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required />
      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="password2" required />
      <input
        class="signup-submit"
        type="submit"
        value="Save my score"
        data-cap-floating="#cap"
      />
      {% include 'cap_widget.html' %}
    </form>
    <p class="auth-links">
      Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </p>
    <p class="auth-links"><a href="{{ url_for('game') }}">Back to the game</a></p>
  </section>
</main>
{% endblock %}
