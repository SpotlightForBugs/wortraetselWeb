{% extends 'scripts.html' %} {% block title %}{{ copy.error_title }}{% endblock %}
{% block content %}
<main class="auth-wrap">
  <section class="auth-card">
    <h2>{{ copy.error_title }}</h2>
    <p>{{ copy.error_body }}</p>
    <p class="auth-links">
      <a href="{{ url_for('game') }}">{{ copy.back_to_game }}</a>
    </p>
  </section>
</main>
{% if sentry_event_id %}
<script>
  if (window.Sentry) {
    Sentry.showReportDialog({ eventId: "{{ sentry_event_id }}" });
  }
</script>
{% endif %} {% endblock %}
